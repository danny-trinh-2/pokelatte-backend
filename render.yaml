services:
  - type: web
    name: pokelatte-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn pokelatte_backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: pokelatte.live,www.pokelatte.live
      - key: CORS_ALLOWED_ORIGINS
        value: https://pokelatte.live,https://www.pokelatte.live,https://master.d37jjazwmjw2tx.amplifyapp.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pokelatte.live,https://www.pokelatte.live
